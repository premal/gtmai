app = "gtmai-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"

[build.args]
  NEXT_PUBLIC_API_URL = "https://gtmai-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
