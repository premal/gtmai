services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gtmai
      POSTGRES_PASSWORD: gtmai
      POSTGRES_DB: gtmai
    ports:
      - "5432:5432"
    volumes:
      - gtmai-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  gtmai-postgres:
